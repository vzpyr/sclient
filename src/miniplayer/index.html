<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SClient</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

      :root {
        --accent: #f50;
        --sclient-bg-base: #0a0a0c;
        --sclient-surface: rgba(255, 255, 255, 0.07);
        --sclient-surface-hover: rgba(255, 255, 255, 0.18);
        --sclient-art-bg: rgba(255, 255, 255, 0.05);
        --sclient-border: rgba(255, 255, 255, 0.08);
        --sclient-progress-track: rgba(255, 255, 255, 0.16);
        --sclient-text-main: #ffffff;
        --sclient-text-muted: rgba(255, 255, 255, 0.65);
        --sclient-text-dim: rgba(255, 255, 255, 0.52);
        --sclient-text-faint: rgba(255, 255, 255, 0.45);
        --sclient-lyric-past: #888888;
        --sclient-on-accent: #111111;
        --sclient-on-accent-hover: #efefef;
        --sclient-danger-hover: rgba(255, 80, 80, 0.32);
        --sclient-input-bg: rgba(0, 0, 0, 0.4);
        --sclient-input-border: rgba(255, 255, 255, 0.33);
        --sclient-radius-pill: 999px;
        --sclient-radius-sm: 8px;
        --sclient-radius-md: 14px;
        --sclient-radius-lg: 18px;
        --sclient-space-1: 4px;
        --sclient-space-2: 8px;
        --sclient-space-3: 12px;
        --sclient-space-4: 14px;
        --sclient-space-6: 16px;
        --sclient-space-8: 32px;
        --sclient-dur: 0.18s;
        --sclient-dur-slow: 0.35s;
        --sclient-dur-slower: 0.4s;
      }

      .progress-fill,
      .artwork::after,
      .btn.active,
      .eyebrow,
      .eq span {
        transition-property:
          background,
          color,
          border-color,
          box-shadow,
          -webkit-text-fill-color,
          background-color;
        transition-duration: var(--sclient-dur-slow);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        font-family: "Inter", system-ui, sans-serif;
        overflow: hidden;
        background: var(--sclient-bg-base);
        color: var(--sclient-text-main);
        user-select: none;
        -webkit-font-smoothing: antialiased;
        -webkit-app-region: drag;
      }
      *:focus {
        outline: none !important;
      }

      #bg {
        position: absolute;
        top: -12%;
        left: -12%;
        width: 124%;
        height: 124%;
        background-size: cover;
        background-position: center;
        filter: blur(28px) brightness(0.4) saturate(1.6);
        z-index: 0;
        transition: background-image 0.6s ease;
      }
      #visualizer {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 2;
        pointer-events: none;
        opacity: 0.3;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background:
          radial-gradient(
            120% 90% at 50% 0%,
            transparent 40%,
            rgba(0, 0, 0, 0.45) 100%
          ),
          linear-gradient(
            160deg,
            rgba(255, 85, 0, 0.06),
            rgba(10, 10, 14, 0.2) 60%
          );
      }
      .top-right {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 20;
        -webkit-app-region: no-drag;
        display: flex;
        align-items: center;
        gap: var(--sclient-space-2);
      }

      .offset-controls {
        display: none;
        align-items: center;
        gap: var(--sclient-space-2);
        background: var(--sclient-surface);
        border: 1px solid var(--sclient-border);
        backdrop-filter: blur(10px);
        border-radius: var(--sclient-radius-pill);
        padding: var(--sclient-space-1) var(--sclient-space-3);
        font-size: 11px;
        color: var(--sclient-text-muted);
        font-variant-numeric: tabular-nums;
      }
      .offset-controls.visible {
        display: flex;
      }
      .offset-val {
        min-width: 30px;
        text-align: right;
      }
      .offset-slider {
        width: 70px;
        accent-color: var(--accent);
        cursor: pointer;
      }
      #btn-romanize {
        display: none;
        width: 30px;
        height: 30px;
        background: var(--sclient-surface);
        border: 1px solid var(--sclient-border);
        backdrop-filter: blur(10px);
        border-radius: var(--sclient-radius-pill);
      }
      .top-right:has(#offset-controls.visible) #btn-romanize {
        display: flex;
      }
      #btn-romanize.active {
        color: var(--accent);
      }
      #btn-romanize svg {
        width: 13px;
        height: 13px;
      }

      .window-controls {
        display: flex;
        gap: 0;
        background: var(--sclient-surface);
        border: 1px solid var(--sclient-border);
        backdrop-filter: blur(10px);
        border-radius: var(--sclient-radius-pill);
        padding: 3px;
      }
      .window-btn {
        background: transparent;
        border: none;
        color: var(--sclient-text-muted);
        border-radius: 50%;
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background var(--sclient-dur),
          color var(--sclient-dur);
        flex-shrink: 0;
      }
      .window-btn + .window-btn {
        margin-left: 1px;
      }
      .window-btn svg {
        width: 11px;
        height: 11px;
      }
      .window-btn:hover {
        background: var(--sclient-surface-hover);
        color: var(--sclient-text-main);
      }
      #btn-close:hover {
        background: var(--sclient-danger-hover);
      }

      .content {
        position: relative;
        z-index: 5;
        height: 100%;
        display: flex;
        flex-direction: row;
        box-sizing: border-box;
        overflow: hidden;
      }

      #player-section {
        display: flex;
        flex-direction: row;
        align-items: stretch;
        justify-content: flex-start;
        gap: var(--sclient-space-4);
        padding: var(--sclient-space-4);
        box-sizing: border-box;
        width: 100%;
        overflow: hidden;
      }

      .artwork-container {
        flex-shrink: 0;
        display: flex;
        align-items: center;
      }
      .artwork {
        width: var(--mini-art-size, 152px);
        height: var(--mini-art-size, 152px);
        border-radius: var(--sclient-radius-md);
        background: var(--sclient-art-bg) center / cover;
        box-shadow:
          0 6px 22px rgba(0, 0, 0, 0.6),
          inset 0 0 0 1px var(--sclient-border);
        transition: border-radius 0.3s;
        position: relative;
      }
      .artwork::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: 16px;
        border: 1px solid var(--accent);
        opacity: 0.25;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .artwork:hover::after {
        opacity: 0.55;
      }

      .right-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
        overflow: hidden;
      }

      .metadata {
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
        opacity: 0.85;
        margin-bottom: 1px;
      }
      .eq {
        display: inline-flex;
        align-items: flex-end;
        gap: 2px;
        height: 10px;
      }
      .eq span {
        display: block;
        width: 2px;
        height: 100%;
        background: var(--accent);
        border-radius: 1px;
        transform-origin: bottom;
        animation: eqbounce 1.1s ease-in-out infinite;
      }
      .eq span:nth-child(1) {
        animation-delay: 0s;
      }
      .eq span:nth-child(2) {
        animation-delay: -0.37s;
      }
      .eq span:nth-child(3) {
        animation-delay: -0.73s;
      }
      .eq.paused span {
        animation-play-state: paused;
        opacity: 0.4;
      }
      @keyframes eqbounce {
        0%,
        100% {
          transform: scaleY(0.3);
        }
        50% {
          transform: scaleY(1);
        }
      }

      .title {
        font-size: 14px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      .artist {
        font-size: 12px;
        font-weight: 500;
        color: var(--sclient-text-dim);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.3;
      }

      .progress-container {
        display: flex;
        align-items: center;
        gap: var(--sclient-space-2);
        width: 100%;
        box-sizing: border-box;
      }
      .time {
        font-size: 10px;
        color: var(--sclient-text-faint);
        flex-shrink: 0;
        font-variant-numeric: tabular-nums;
        min-width: 28px;
      }
      .time:first-child {
        text-align: left;
      }
      .time:last-child {
        text-align: right;
      }
      .progress-bar {
        flex: 1;
        height: 3px;
        background: var(--sclient-progress-track);
        border-radius: var(--sclient-radius-pill);
        position: relative;
        cursor: pointer;
        -webkit-app-region: no-drag;
        transition: height var(--sclient-dur);
      }
      .progress-bar:hover {
        height: 6px;
      }
      .progress-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        background: linear-gradient(
          90deg,
          var(--accent),
          color-mix(in srgb, var(--accent) 60%, #fff)
        );
        border-radius: var(--sclient-radius-pill);
        width: 0%;
        pointer-events: none;
        transition: width 0.1s linear;
        box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent);
      }
      .progress-fill::after {
        content: "";
        position: absolute;
        right: -5px;
        top: 50%;
        transform: translateY(-50%) scale(0);
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--sclient-text-main);
        box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 80%, transparent);
        transition: transform var(--sclient-dur);
      }
      .progress-bar:hover .progress-fill::after {
        transform: translateY(-50%) scale(1);
      }

      .controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        -webkit-app-region: no-drag;
      }

      #lyrics-content {
        -webkit-app-region: no-drag;
      }
      .btn {
        background: none;
        border: none;
        color: var(--sclient-text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        flex-shrink: 0;
        transition:
          color var(--sclient-dur),
          transform var(--sclient-dur);
        line-height: 0;
      }
      .btn svg {
        width: 17px;
        height: 17px;
        display: block;
      }
      .btn:hover {
        color: var(--sclient-text-main);
        transform: scale(1.14);
      }
      .btn.active {
        color: var(--accent);
      }
      .btn.active:hover {
        color: var(--accent);
      }
      .transport {
        display: flex;
        align-items: center;
        gap: var(--sclient-space-3);
        background: var(--sclient-surface);
        border: 1px solid var(--sclient-border);
        border-radius: var(--sclient-radius-pill);
        padding: 5px 10px;
      }
      .btn-main {
        width: 40px;
        height: 40px;
        background: var(--sclient-text-main);
        color: var(--sclient-on-accent);
        border-radius: 50%;
      }
      .btn-main svg {
        width: 20px;
        height: 20px;
      }
      .btn-main:hover {
        transform: scale(1.06);
        background: var(--sclient-on-accent-hover);
        color: var(--sclient-on-accent);
      }

      #lyrics-section {
        display: none;
        flex: 1;
        flex-direction: column;
        overflow: hidden;
        box-sizing: border-box;
        padding: 0;
      }
      .with-lyrics #lyrics-section {
        display: flex;
      }

      #lyrics-content {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        text-align: center;
        padding: 0 var(--sclient-space-4);
        box-sizing: border-box;
        -webkit-app-region: no-drag;
      }
      #lyrics-content::-webkit-scrollbar {
        width: 0;
        display: none;
      }
      #lyrics-content::-webkit-scrollbar-thumb,
      #lyrics-content::-webkit-scrollbar-track {
        display: none;
      }
      #lyrics-content {
        scrollbar-width: none;
      }

      .mini-empty {
        opacity: 0.5;
        text-align: center;
        margin-top: 20px;
      }

      .mini-lyrics-lines {
        display: flex;
        flex-direction: column;
        gap: var(--sclient-space-3);
        padding: 50vh 10px 50vh 10px;
      }
      .mini-lyrics-plain {
        display: flex;
        flex-direction: column;
        gap: var(--sclient-space-3);
        padding: 0 10px 20vh 10px;
      }
      .mini-lyrics-plain > div {
        font-size: 15px;
      }

      .mini-manual {
        margin-top: 15px;
      }
      .mini-manual-label {
        margin-bottom: var(--sclient-space-2);
        font-size: 12px;
        color: var(--sclient-text-dim);
      }
      .mini-input {
        width: 80%;
        margin-bottom: var(--sclient-space-2);
        padding: 6px;
        background: var(--sclient-input-bg);
        border: 1px solid var(--sclient-input-border);
        color: var(--sclient-text-main);
        border-radius: var(--sclient-radius-sm);
        font-family: inherit;
        box-sizing: border-box;
      }
      .mini-btn-trigger {
        margin-top: var(--sclient-space-4);
      }

      .mini-manual {
        margin-top: 15px;
      }
      .mini-manual-label {
        margin-bottom: var(--sclient-space-2);
        font-size: 12px;
        color: var(--sclient-text-dim);
      }
      .mini-input {
        width: 80%;
        margin-bottom: var(--sclient-space-2);
        padding: 6px;
        background: var(--sclient-input-bg);
        border: 1px solid var(--sclient-input-border);
        color: var(--sclient-text-main);
        border-radius: var(--sclient-radius-sm);
        font-family: inherit;
        box-sizing: border-box;
      }
      .mini-btn {
        padding: 6px 16px;
        background: var(--sclient-surface);
        border: 1px solid var(--sclient-input-border);
        color: var(--sclient-text-main);
        border-radius: var(--sclient-radius-sm);
        cursor: pointer;
        transition: background var(--sclient-dur);
      }
      .mini-btn:hover {
        background: var(--sclient-surface-hover);
      }

      .lyric-line {
        transition:
          color var(--sclient-dur-slower) ease,
          transform var(--sclient-dur-slower) ease,
          font-size var(--sclient-dur-slower) ease,
          opacity var(--sclient-dur-slower) ease,
          filter var(--sclient-dur-slower) ease;
        font-size: 14px;
        color: var(--sclient-text-main);
        transform-origin: center;
        transform: scale(0.95);
        cursor: pointer;
        padding: 4px 10px;
        box-sizing: border-box;
        border-radius: var(--sclient-radius-sm);
      }
      .lyric-line.active {
        font-size: 16px;
        font-weight: 700;
        transform: scale(1.1);
        opacity: 1;
        filter: blur(0px);
        color: var(--accent);
      }
      .lyric-line.active:has(.lyric-word) {
        color: var(--sclient-text-main);
      }
      .lyric-word.sung {
        color: var(--accent) !important;
      }
      .lyric-line.past {
        color: var(--sclient-lyric-past);
        font-weight: normal;
        transform: scale(0.95);
        opacity: 0.4;
        filter: blur(2px);
      }
      .lyric-line:hover {
        opacity: 0.9 !important;
        transform: scale(1.05) !important;
        filter: blur(0px) !important;
      }

      @media (max-width: 899px), (max-height: 499px) {
        .with-lyrics #player-section {
          flex-direction: column;
          width: 255px;
          flex-shrink: 0;
          align-items: flex-start;
          justify-content: center;
          gap: var(--sclient-space-4);
          padding: var(--sclient-space-4);
        }
        .with-lyrics .artwork {
          width: var(--mini-art-size, 152px);
          height: var(--mini-art-size, 152px);
        }
        .with-lyrics .right-panel {
          flex: none;
          width: 100%;
        }
        .with-lyrics #lyrics-section {
          padding: var(--sclient-space-4) var(--sclient-space-4)
            var(--sclient-space-4) 0;
        }
      }

      @media (min-width: 900px) and (min-height: 500px) {
        .content {
          padding: 5% 8%;
          align-items: center;
          justify-content: flex-start;
          overflow: visible;
        }
        .content.with-lyrics {
          align-items: stretch;
          gap: 6%;
          padding-top: 0;
          padding-bottom: 0;
        }

        #player-section {
          padding: 0;
          gap: 36px;
          align-items: center;
          overflow: visible;
        }
        .with-lyrics #player-section {
          flex-direction: column;
          flex: none;
          width: 40%;
          max-width: 520px;
          min-width: 280px;
          align-items: flex-start;
          justify-content: center;
          gap: 36px;
          padding: 0;
        }

        .artwork {
          flex-shrink: 0;
          width: clamp(200px, 30vh, 340px);
          height: clamp(200px, 30vh, 340px);
          border-radius: var(--sclient-radius-lg);
          box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.7),
            inset 0 0 0 1px rgba(255, 255, 255, 0.1);
          overflow: visible;
        }
        .artwork::after {
          inset: -4px;
          border-radius: 22px;
        }

        .right-panel {
          flex: 1;
          min-width: 0;
          max-width: 720px;
          gap: 36px;
          justify-content: center;
        }
        .with-lyrics .right-panel {
          flex: none;
          width: 100%;
          max-width: 100%;
        }

        .metadata {
          gap: 10px;
        }
        .eyebrow {
          font-size: 11px;
        }
        .eq {
          height: 13px;
        }
        .title {
          font-size: clamp(22px, 2.6vw, 36px);
          font-weight: 800;
          white-space: normal;
          line-height: 1.2;
          letter-spacing: -0.02em;
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
        }
        .artist {
          font-size: clamp(14px, 1.6vw, 20px);
          font-weight: 500;
          color: var(--sclient-text-dim);
        }

        .progress-container {
          gap: var(--sclient-space-4);
        }
        .time {
          font-size: 13px;
          min-width: 42px;
          color: var(--sclient-text-faint);
        }
        .progress-bar {
          height: 5px;
          border-radius: var(--sclient-radius-pill);
        }
        .progress-bar:hover {
          height: 8px;
        }

        .controls {
          justify-content: flex-start;
          gap: var(--sclient-space-8);
        }

        .btn svg {
          width: 34px;
          height: 34px;
        }
        .btn-main {
          width: 74px;
          height: 74px;
        }
        .btn-main svg {
          width: 36px;
          height: 36px;
        }
        .transport {
          gap: 22px;
          padding: var(--sclient-space-2) var(--sclient-space-4);
        }

        #lyrics-section {
          display: flex;
          flex: 1;
          align-self: stretch;
          padding: 0;
        }
        #lyrics-content {
          padding: 0 40px;
        }
        .lyric-line {
          font-size: clamp(16px, 1.7vw, 22px);
          padding: 9px var(--sclient-space-4);
          border-radius: 10px;
        }
        .lyric-line.active {
          font-size: clamp(20px, 2.3vw, 30px);
          transform: scale(1.08);
        }
        .lyric-line.past {
          transform: scale(0.93);
        }
      }
    </style>
  </head>
  <body>
    <div id="bg"></div>
    <canvas id="visualizer"></canvas>

    <div class="top-right">
      <button
        class="window-btn romanize-btn"
        id="btn-romanize"
        title="Romanize lyrics"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="lucide lucide-languages-icon lucide-languages"
        >
          <path d="m5 8 6 6" />
          <path d="m4 14 6-6 2-3" />
          <path d="M2 5h12" />
          <path d="M7 2h1" />
          <path d="m22 22-5-10-5 10" />
          <path d="M14 18h6" />
        </svg>
      </button>
      <div class="offset-controls" id="offset-controls">
        <input
          type="range"
          id="offset-slider"
          class="offset-slider"
          min="-2"
          max="2"
          step="0.1"
          value="0"
          title="Lyrics timing offset"
        />
        <span id="offset-val" class="offset-val">0.0s</span>
      </div>
      <div class="window-controls">
        <button class="window-btn" id="btn-minimize" title="Minimize">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-minus-icon lucide-minus"
          >
            <path d="M5 12h14" />
          </svg>
        </button>
        <button class="window-btn" id="btn-fullscreen" title="Fullscreen">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-maximize-icon lucide-maximize"
          >
            <path d="M8 3H5a2 2 0 0 0-2 2v3" />
            <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
            <path d="M3 16v3a2 2 0 0 0 2 2h3" />
            <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
          </svg>
        </button>
        <button class="window-btn" id="btn-close" title="Back to main window">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-x-icon lucide-x"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
    </div>

    <div class="content">
      <div id="player-section">
        <div class="artwork-container">
          <div class="artwork" id="artwork"></div>
        </div>

        <div class="right-panel">
          <div class="metadata">
            <div class="eyebrow">
              <span class="eq" id="eq-indicator">
                <span></span><span></span><span></span>
              </span>
              Now Playing
            </div>
            <div class="title" id="title">Not Playing</div>
            <div class="artist" id="artist">-</div>
          </div>

          <div class="progress-container">
            <div class="time" id="time-current">0:00</div>
            <div class="progress-bar" id="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="time" id="time-duration">0:00</div>
          </div>

          <div class="controls">
            <button class="btn" id="btn-shuffle" title="Shuffle">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-shuffle-icon lucide-shuffle"
              >
                <path d="m18 14 4 4-4 4" />
                <path d="m18 2 4 4-4 4" />
                <path
                  d="M2 18h1.973a4 4 0 0 0 3.3-1.7l5.454-8.6a4 4 0 0 1 3.3-1.7H22"
                />
                <path d="M2 6h1.972a4 4 0 0 1 3.6 2.2" />
                <path d="M22 18h-6.041a4 4 0 0 1-3.3-1.8l-.359-.45" />
              </svg>
            </button>
            <button class="btn" id="btn-loop" title="Repeat">
              <svg
                id="icon-loop-all"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-repeat-icon lucide-repeat"
                style="display: block"
              >
                <path d="m17 2 4 4-4 4" />
                <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
                <path d="m7 22-4-4 4-4" />
                <path d="M21 13v1a4 4 0 0 1-4 4H3" />
              </svg>
              <svg
                id="icon-loop-one"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                style="display: none"
                class="lucide lucide-repeat-1-icon lucide-repeat-1"
              >
                <path d="m17 2 4 4-4 4" />
                <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
                <path d="m7 22-4-4 4-4" />
                <path d="M21 13v1a4 4 0 0 1-4 4H3" />
                <path d="M11 10h1v4" />
              </svg>
            </button>

            <div class="transport">
              <button class="btn" id="btn-prev" title="Previous">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-skip-back-icon lucide-skip-back"
                >
                  <path
                    d="M17.971 4.285A2 2 0 0 1 21 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"
                  />
                  <path d="M3 20V4" />
                </svg>
              </button>
              <button
                class="btn btn-main"
                id="btn-playpause"
                title="Play/Pause"
              >
                <svg
                  id="icon-play"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-play-icon lucide-play"
                  style="display: none"
                >
                  <path
                    d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"
                  />
                </svg>
                <svg
                  id="icon-pause"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-pause-icon lucide-pause"
                >
                  <rect x="14" y="3" width="5" height="18" rx="1" />
                  <rect x="5" y="3" width="5" height="18" rx="1" />
                </svg>
              </button>
              <button class="btn" id="btn-next" title="Next">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="20"
                  height="20"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  class="lucide lucide-skip-forward-icon lucide-skip-forward"
                >
                  <path d="M21 4v16" />
                  <path
                    d="M6.029 4.285A2 2 0 0 0 3 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"
                  />
                </svg>
              </button>
            </div>

            <button class="btn" id="btn-like" title="Like">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-heart-icon lucide-heart"
              >
                <path
                  d="M2 9.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5c0 2.29-1.5 4-3 5.5l-5.492 5.313a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5"
                />
              </svg>
            </button>
            <button class="btn" id="btn-lyrics" title="Lyrics">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                class="lucide lucide-mic-vocal-icon lucide-mic-vocal"
              >
                <path
                  d="m11 7.601-5.994 8.19a1 1 0 0 0 .1 1.298l.817.818a1 1 0 0 0 1.314.087L15.09 12"
                />
                <path
                  d="M16.5 21.174C15.5 20.5 14.372 20 13 20c-2.058 0-3.928 2.356-6 2-2.072-.356-2.775-3.369-1.5-4.5"
                />
                <circle cx="16" cy="7" r="5" />
              </svg>
            </button>
          </div>
        </div>
      </div>

      <div id="lyrics-section">
        <div id="lyrics-content">
          <div class="mini-empty">Open a song to load lyrics</div>
        </div>
      </div>
    </div>

    <script src="./index.js"></script>
  </body>
</html>
